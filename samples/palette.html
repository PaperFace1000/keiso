<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keiso — Palette</title>
<link rel="stylesheet" href="../tokens/themes.css">
<link rel="stylesheet" href="../tokens/extra-colors.css">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/kit.css">
<link rel="stylesheet" href="assets/sample.css">
<script src="assets/icons.js"></script>
<script src="assets/sample.js"></script>
<style>
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: var(--space-4); }
.board__col { background: var(--color-base); color: var(--color-text); border: var(--line) solid var(--color-border); padding: var(--space-4); display: grid; gap: var(--space-4); align-content: start; }
.board__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
.board__head strong { font-size: 20px; }
.swatches { display: grid; gap: 0; border-top: var(--line) solid var(--color-border); }
.swatch { display: grid; grid-template-columns: 28px 1fr auto; gap: var(--space-2); align-items: center; padding: 6px 0; border-bottom: var(--line) solid var(--color-border); font-size: 12px; }
.swatch i { width: 28px; height: 20px; border: var(--line) solid var(--color-border); }
.swatch code { font-size: 11px; }
.swatch__ratio { font: 500 11px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.swatch__ratio.is-low { color: var(--color-alert); }
.swatch__ratio.is-na { color: var(--color-muted); }
.roles { display: grid; gap: var(--space-2); }
.specimen { display: grid; gap: var(--space-2); padding: var(--space-3); background: var(--color-surface); border: var(--line) solid var(--color-border); }
.specimen__big { font-size: 40px; }
</style>
</head>
<body class="k-dotgrid">
<header id="js-sample-header"></header>
<main class="k-page">
  <section class="sample-intro">
    <span class="k-label k-bracket">Palette</span>
    <h1>配色</h1>
    <p>4 つのテーマを並べています。右の数字は、その色を文字として重ねたときのコントラスト比です（基準の地はベース、文字の上に乗る色はその地）。文字として使う組み合わせはすべて 4.5 以上にしてあり、<code>tools/build.py</code> が下回る色を止めます。アクセントは文字に使わない前提なので比は参考です。</p>
  </section>

  <section class="sample-section" aria-labelledby="board-title">
    <div class="k-heading"><h2 id="board-title">4 テーマ</h2><span class="k-label">tokens/palette.json</span></div>
    <div class="board" id="js-board"></div>
  </section>
</main>
<script>
(() => {
  // [変数名, 説明, 比を測る地（null なら測らない）]
  const TOKENS = [
    ['base', 'ベース。画面の地', null],
    ['surface', 'サーフェス。欄・入力欄の地', null],
    ['sunken', '沈んだ地。なぞったとき', null],
    ['border', '枠線', null],
    ['border-strong', '強い枠線・入力欄の枠', null],
    ['text', '本文', 'base'],
    ['muted', '補足の文字', 'surface'],
    ['accent', 'アクセント。印・フォーカス', 'base'],
    ['accent-strong', 'アクセント（文字）', 'base'],
    ['on-accent-strong', 'アクセント（文字）の上の文字', 'accent-strong'],
    ['selection-bg', '反転の地（選んでいる行）', null],
    ['selection-text', '反転の文字', 'selection-bg'],
    ['grid-dot', '地の点の格子', null],
  ];
  const ROLES = [['success', 'SUCCESS', '保存しました'], ['info', 'INFO', '新しい版があります'], ['warning', 'WARNING', '残りの容量が 10% です'], ['alert', 'ALERT', '接続できませんでした']];

  const to_rgb = (value) => {
    const m = value.trim().match(/^#([0-9a-f]{6})$/i);
    if (!m) return null;
    return [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16) / 255);
  };
  const luminance = (rgb) => {
    const [r, g, b] = rgb.map((v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const ratio = (a, b) => {
    const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p);
    return (x + 0.05) / (y + 0.05);
  };

  const board = document.getElementById('js-board');
  board.innerHTML = window.keiso_sample.THEMES.map((t) => `
    <article class="board__col" data-theme="${t.key}">
      <div class="board__head"><strong>${t.label}</strong><span class="k-label">${t.key}</span></div>
      <div class="specimen">
        <span class="k-label">Battery</span>
        <span class="specimen__big k-dot">82<small class="k-muted" style="font-size: 16px;">%</small></span>
        <span class="k-muted" style="font-size: 13px;">本文の文字と補足の文字。<a href="#" style="color: var(--color-accent-strong);">アクセントの文字</a></span>
      </div>
      <div class="roles">
        ${ROLES.map(([key, label, body]) => `
          <div class="k-notice k-role-${key}">
            <span data-icon="line:${{ success: 'check-circle', info: 'info', warning: 'warning', alert: 'warning-octagon' }[key]}"></span>
            <span class="k-notice__title">${label}</span>
            <span class="k-notice__body">${body}</span>
          </div>`).join('')}
      </div>
      <div class="swatches" data-swatches></div>
      <div class="swatches" data-role-swatches></div>
    </article>`).join('');

  const render_ratios = () => {
    board.querySelectorAll('.board__col').forEach((col) => {
      const style = getComputedStyle(col);
      const value = (name) => style.getPropertyValue(`--color-${name}`).trim();
      const row = (name, note, bg_name) => {
        const fg = to_rgb(value(name));
        const bg = bg_name ? to_rgb(value(bg_name)) : null;
        const r = fg && bg ? ratio(fg, bg) : null;
        const cls = r === null ? 'is-na' : (r < 4.5 && name !== 'accent' ? 'is-low' : '');
        return `<div class="swatch"><i style="background: var(--color-${name});"></i>
          <span><code>--color-${name}</code><br><span class="k-muted">${note}</span></span>
          <span class="swatch__ratio ${cls}">${r === null ? value(name) : r.toFixed(1)}</span></div>`;
      };
      col.querySelector('[data-swatches]').innerHTML = TOKENS.map(([n, note, bg]) => row(n, note, bg)).join('');
      col.querySelector('[data-role-swatches]').innerHTML = ROLES.map(([key, label]) =>
        row(key, `${label} の文字（地: -bg）`, `${key}-bg`) + row(`${key}-bg`, `${label} の地`, null) + row(`${key}-border`, `${label} の枠`, null)).join('');
    });
  };
  document.addEventListener('DOMContentLoaded', () => {
    window.keiso_sample.fill_icons(board);
    render_ratios();
  });
})();
</script>
</body>
</html>
